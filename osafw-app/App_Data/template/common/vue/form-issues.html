<div v-if="fwStore.uioptions.edit.is_validation_summary && fwStore.formIssues().length"
     class="fw-validation-summary alert py-2" :class="fwStore.formIssues().some(issue => issue.severity === 'error') ? 'alert-danger' : 'alert-warning'" aria-live="polite">
    <span class="fw-semibold">`Please review these fields:` </span>
    <template v-for="(issue,index) in fwStore.formIssues()" :key="index">
        <span v-if="index" aria-hidden="true"> &middot; </span>
        <button v-if="issue.field" type="button" class="btn btn-link p-0 text-start text-reset" @click="fwStore.focusFormIssue(issue, $event.currentTarget.closest('form'))">{{fwStore.issueLabel(issue)}}: {{issue.message}}</button>
        <span v-else>{{issue.message}}</span>
    </template>
</div>
