<script type="text/x-template" id="form-one-group-template">
    <label class="col-form-label" :class="def.class_label ? def.class_label : 'col-md-3'" :required="def.required">
        {{def.label}}
        <small v-if="def.help_label" class="d-block form-text fw-normal" :class="def.help_label_class">{{def.help_label}}</small>
        <small v-if="def.help_label_html" class="d-block form-text fw-normal" :class="def.help_label_class" v-html="def.help_label_html"></small>
    </label>
    <div :class="def.class_contents ? def.class_contents : 'col'" :data-fw-field="def.issue_field ?? def.field" :data-fw-row="form.row_id ?? form.i?.id" tabindex="-1">
        <form-one-control :form="form"
                          @update-form-field="$emit('update-form-field', $event)"
                          @cancel-form="$emit('cancel-form', $event)"
                          :def="def"
                          :lookups="lookups" />
        <div v-for="(issue,index) in fwStore.fieldIssues(def, form)" :key="index" :class="issue.severity === 'warning' ? 'text-warning-emphasis' : 'text-danger'" class="small" aria-live="polite">
            {{issue.message}}
            <span v-if="issue.value !== undefined" class="d-block">Entered value: {{issue.value}}</span>
        </div>
    </div>
</script>

<script type="module">
    import { mapStores } from 'pinia';
    fwApp.component('form-one-group', {
        template: '#form-one-group-template',
        props: {
            def: {
                type: Object,
                required: true
            },
            lookups: {
                type: Object,
                required: true
            },
            form: {
                type: Object,
                required: true
            }
        },
        emits: ['update-form-field', 'cancel-form'],
        data: () => ({
        }),
        computed: { ...mapStores(fwStore) },
        mounted() {
            //console.log("form-one-group mounted", this.def);
        },
        methods: {
        }
    });
</script>
