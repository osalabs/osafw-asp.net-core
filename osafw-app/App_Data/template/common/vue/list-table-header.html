<script type="text/x-template" id="list-table-header-template">
    <thead>
        <tr>
            <th class="d-print-none"><input type="checkbox" name="all" Xv-model="cb_check_all" v-model="checkedAll" @change="onCheckAll" /></th>
            <th v-if="uioptions.isButtonsLeft && uioptions.rowButtons !== false" class="d-print-none"></th>

            <template v-for="header in fwStore.list_headers" :key="header.field_name">
                <th :class="'rotate fw-column-resizable'+(header.is_sortable && fwStore.f.sortby==header.field_name ? ' active-sort' : '')"
                    :style="{ minWidth: header.list_min_width || null }"
                    :data-fw-column="header.field_name"
                    :data-sort="header.is_sortable"
                    @click="(event) => onSortHeader(event, header)">
                    <div>
                        <span>{{header.field_name_visible}}</span>
                        <span class="ms-1" v-if="header.is_sortable && fwStore.f.sortby==header.field_name">
                            <span v-if="fwStore.f.sortdir=='desc'"><~/common/icons/arrow-up></span><span v-else><~/common/icons/arrow-down></span>
                        </span>
                    </div>
                    <button type="button" class="fw-column-resize"
                            :aria-label="'Resize ' + header.field_name_visible"
                            title="`Drag or use arrow keys to resize; double-click to fit; Ctrl+double-click to fit all columns`"
                            @click.stop @pointerdown.stop.prevent="startResize($event, header)"
                            @dblclick.stop.prevent="autoFit($event, header)"
                            @keydown.stop="resizeKey($event, header)"></button>
                </th>
            </template>

            <th v-if="!uioptions.isButtonsLeft && uioptions.rowButtons !== false"></th>
        </tr>
        <tr class="search" :style="fwStore.is_list_search_open ? 'display: table-row' : ''">
            <th></th>
            <th v-if="uioptions.isButtonsLeft && uioptions.rowButtons!==false"></th>
            <th v-for="header in fwStore.list_headers" :key="header.field_name">
                <list-column-filter v-if="hasColumnFilter(header)" :header="header"></list-column-filter>
                <input v-else type="text" class="form-control form-control-sm"
                       v-model="header.search_value"
                       :disabled="isCalculatedField(header.field_name)"
                       @change="fwStore.loadIndexDebounced"
                       @keyup.enter.stop="fwStore.loadIndexDebounced">
            </th>
            <th v-if="!uioptions.isButtonsLeft && uioptions.rowButtons!==false"></th>
        </tr>
    </thead>
</script>

<script type="module">
    import { mapStores } from 'pinia';

    fwApp.component('list-table-header', {
        template: '#list-table-header-template',
        props: {
        },
        data: () => ({
            cb_check_all: false
        }),
        computed: {
            ...mapStores(fwStore),
            uioptions() {
                return this.fwStore.uioptions.list.table ?? {};
            },
            checkedAll: {
                get: function () {
                    return this.fwStore.list_rows.length > 0 && this.fwStore.list_rows.length === Object.keys(this.fwStore.hchecked_rows).length;
                },
                set: function (val) {
                    this.cb_check_all = val;
                },
            },
            listCalculatedFields(){
                const fields = this.fwStore.list_calculated_fields ?? [];
                return Array.isArray(fields) ? fields : Object.values(fields);
            }
        },
        beforeUnmount() {
            this.finishResize(false);
        },
        methods: {
            startResize(event, header) {
                if (event.button !== 0) {
                    return;
                }

                this.finishResize(false);
                const cell = event.currentTarget.closest('th');
                const initial = cell.getBoundingClientRect().width;
                const startX = event.clientX;
                const previous = this.fwStore.list_user_view.widths;
                const move = pointerEvent => {
                    this.resizeSession.isMoved = pointerEvent.clientX !== startX;
                    const width = Math.max(
                        60,
                        Math.min(800, Math.round(initial + pointerEvent.clientX - startX))
                    );
                    this.fwStore.list_user_view.widths = { ...this.fwStore.columnWidths(), [header.field_name]: width };
                };
                const stop = () => this.finishResize(true);
                const cancel = () => this.finishResize(false);
                this.resizeSession = { field: header.field_name, move, stop, cancel, previous, isMoved: false };
                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', stop);
                window.addEventListener('pointercancel', cancel);
                window.addEventListener('blur', cancel);
            },
            finishResize(isSave) {
                const session = this.resizeSession;
                if (!session) {
                    return;
                }
                window.removeEventListener('pointermove', session.move);
                window.removeEventListener('pointerup', session.stop);
                window.removeEventListener('pointercancel', session.cancel);
                window.removeEventListener('blur', session.cancel);
                const width = this.fwStore.columnWidths()[session.field];
                this.fwStore.list_user_view.widths = session.previous;
                this.resizeSession = null;
                if (isSave && session.isMoved && width) {
                    this.fwStore.saveColumnWidth(session.field, width);
                }
            },
            resizeKey(event, header) {
                if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
                    return;
                }

                event.preventDefault();
                const current = this.fwStore.columnWidths()[header.field_name]
                    ?? event.currentTarget.closest('th').getBoundingClientRect().width;
                let width = current + (event.key === 'ArrowRight' ? 10 : -10);
                if (event.key === 'Home') {
                    width = 60;
                } else if (event.key === 'End') {
                    width = 800;
                }

                this.fwStore.saveColumnWidth(header.field_name, width);
            },
            autoFit(event, header) {
                const table = event.currentTarget.closest('table');
                const headers = event.ctrlKey ? this.fwStore.list_headers : [header];
                const widths = Object.fromEntries(headers.map(column => [column.field_name, 60]));
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                for (const cell of table.querySelectorAll('[data-fw-column]')) {
                    const field = cell.dataset.fwColumn;
                    if (!Object.hasOwn(widths, field)) {
                        continue;
                    }
                    context.font = getComputedStyle(cell).font;
                    const lines = cell.innerText.split('\n');
                    for (const control of cell.querySelectorAll('input:not([type=hidden]),textarea,select')) {
                        const value = control.tagName === 'SELECT'
                            ? Array.from(control.selectedOptions, option => option.text).join(' ') : control.value;
                        lines.push(...value.split('\n'));
                    }
                    for (const line of lines) {
                        widths[field] = Math.max(widths[field], context.measureText(line).width + 32);
                    }
                }
                if (event.ctrlKey) {
                    this.fwStore.saveColumnWidths(widths);
                } else {
                    this.fwStore.saveColumnWidth(header.field_name, widths[header.field_name]);
                }
            },
            // Sorting handler
            onSortHeader(e, header) {
                if (!header.is_sortable) return;

                let new_sortdir = 'asc'; //default sort
                if (this.fwStore.f.sortby === header.field_name) {
                    //active column - change sort dir
                    new_sortdir = this.fwStore.f.sortdir === 'asc' ? 'desc' : 'asc';
                }

                this.resetCheckedRows();
                this.fwStore.setFilters({
                    sortby: header.field_name,
                    sortdir: new_sortdir
                });
            },
            //check all/none rows
            onCheckAll(e) {
                if (e.target.checked) {
                    // check all rows
                    this.fwStore.hchecked_rows = this.fwStore.list_rows.reduce((acc, row) => {
                        acc[row[this.fwStore.field_id]] = true;
                        return acc;
                    }, {});
                } else {
                    this.resetCheckedRows();
                }
            },
            resetCheckedRows() {
                this.fwStore.hchecked_rows = {};
            },
            isCalculatedField(fieldName) {
                return this.listCalculatedFields.includes(fieldName);
            },
            hasColumnFilter(header) {
                const type = header.filter && header.filter.type;
                return !!type && (type === 'none' || !this.isCalculatedField(header.field_name));
            }
        }
    });
</script>
