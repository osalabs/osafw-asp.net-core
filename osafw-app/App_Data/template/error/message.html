<section class="text-center my-4 mx-auto" style="max-width:42rem" aria-labelledby="error-title">
    <h1 id="error-title"><~error[title]></h1>
    <p class="lead"><~error[description]></p>
    <div class="alert alert-warning text-start" role="alert"><~error[display_message] nl2br></div>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <~signin if="error[show_login]" inline>
        <a class="btn btn-primary" href="<~error[login_url]>">`Sign in`</a>
        </~signin>
        <a class="btn btn-outline-secondary" href="<~GLOBAL[ROOT_URL]>/">`Go to home page`</a>
    </div>
</section>
