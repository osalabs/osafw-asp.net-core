<h1><~title></h1>
<~/common/form/msg>
<form class="fw-card" method="post" action="<~../url>/(Delete)/<~id>">
  <input type="hidden" name="XSS" value="<~SESSION[XSS]>">
  <p>`Delete scheduled task` <strong><~i[iname]></strong>?</p>
  <button type="submit" class="btn btn-danger">`Delete`</button>
  <a class="btn btn-default" href="<~../url>/<~id>">`Cancel`</a>
</form>
