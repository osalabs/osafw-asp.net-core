<div class="row form-row">
  <label class="col-form-label col-md-3">`Current value`</label>
  <div class="col">
    <p id="setting_value_display" class="form-control-plaintext"><~i[ivalue_display]></p>
    <~reveal_button if="can_reveal" inline><button type="button" id="setting_reveal" class="btn btn-sm btn-outline-secondary">`Reveal`</button></~reveal_button>
  </div>
</div>
<div class="row form-row">
  <label class="col-form-label col-md-3" for="ivalue">`New value`</label>
  <div class="col">
    <textarea id="ivalue" name="item[ivalue]" rows="5" class="form-control" autocomplete="off"></textarea>
    <small class="form-text">`Leave blank to keep the current value.`</small>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="clear_value" name="item[clear]" value="1">
      <label class="form-check-label" for="clear_value">`Clear the saved value`</label>
    </div>
  </div>
</div>
