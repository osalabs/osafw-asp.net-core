<link rel="stylesheet" href="<~ROOT_URL>/assets/css/spages-editor.css?v=2">
<div class="spages-cms">
<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="<~../url>">Pages</a></li><li class="breadcrumb-item active" aria-current="page">Redirects</li></ol></nav>
<h1>Page redirects</h1><p>Send an old local address to a new destination. Published page URL changes create redirects automatically.</p>
<form id="cms-redirect" class="fw-card p-3" method="post" action="<~../url>/(SaveRedirect)"><input type="hidden" name="XSS" value="<~session[XSS]>"><div class="row g-3"><label class="col-md-5">Old path<input class="form-control" name="source_url" required placeholder="/old-page"></label><label class="col-md-5">Destination<input class="form-control" name="target_url" required placeholder="/new-page"></label><div class="col-md-2 align-self-end"><button class="btn btn-primary">Save redirect</button></div></div></form>
<p id="redirect-result" role="status" aria-live="polite"></p>
<div class="table-responsive"><table class="table mt-4"><thead><tr><th>Old path</th><th>Destination</th><th>Action</th></tr></thead><tbody><~items repeat inline><tr><td class="text-break"><~source_url></td><td class="text-break"><~target_url></td><td><button type="button" class="btn btn-sm btn-outline-danger" data-remove="<~../url>/(RemoveRedirect)/<~id>">Remove</button></td></tr></~items></tbody></table></div>
</div>
<script src="<~ROOT_URL>/assets/js/spages-redirects.js?v=2" defer></script>
