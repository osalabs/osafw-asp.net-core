<button class="btn btn-default" type="button" data-preview><~/common/icons/eye><span class="btn-label">Preview</span></button>
<button class="btn btn-primary" type="submit" form="spages-editor" <~/common/attr/disabled unless="is_author">><~/common/icons/floppy><span class="btn-label">Save draft</span></button>
<~publish if="is_publisher" inline><button class="btn btn-success" type="button" data-status-action="Publish" data-publish-now title="Publish now" <~/common/attr/disabled unless="is_author">><~/common/icons/journal-arrow-up><span class="btn-label">Publish Now</span></button></~publish>
