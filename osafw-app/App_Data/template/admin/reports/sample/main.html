<~report_ui unless="IS_PRINT_MODE" inline>
  <~/admin/reports/common/page_header>
  <div data-fw-component-scope data-report-schedule-scope>
    <~list_filter>
    <~/admin/reports/common/schedule_email>
  </div>
</~report_ui>
<~print_title if="IS_PRINT_MODE" inline>
  <div class="d-flex align-items-center gap-3 mb-2 sample-report-title">
    <~pdf_logo if="IS_EXPORT_PDF" inline>
      <img src="<~PDF_ASSETS_URL>/img/logo.png" alt="Site logo" height="40">
    </~pdf_logo>
    <~/admin/reports/common/title>
  </div>
</~print_title>

<~report_html if="is_run">
